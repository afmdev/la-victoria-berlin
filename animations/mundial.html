<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mundial 2026 — La Victoria Berlin</title>
		<style>
			@font-face {
				font-family: "Radius";
				src: url("../assets/fonts/Radius-BoldNarrow.otf") format("opentype");
				font-display: swap;
			}

			@font-face {
				font-family: "Groches";
				src: url("../assets/fonts/GROCHES.otf") format("opentype");
				font-display: swap;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				background: #0a0a0a;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				overflow: hidden;
			}

			.card-wrapper {
				flex-shrink: 0;
			}

			.card {
				position: relative;
				width: 1080px;
				height: 1920px;
				transform-origin: top left;
				overflow: hidden;
			}

			.bg {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: center;
			}

			.overlay {
				position: absolute;
				inset: 0;
				background: #1E1C1A;
				opacity: 1;
			}

			.corner-frame {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
			}

			.content {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			/* ── Corner/edge stars ── */
			.star-top,
			.star-bottom {
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				width: 52px;
				height: auto;
			}

			.star-top    { top: 36px; }
			.star-bottom { bottom: 36px; }

			/* ── Logos ── */
			.logo-victoria {
				width: 620px;
				height: auto;
				margin-top: 180px;
				margin-bottom: -30px;
			}

			.star-between {
				width: 52px;
				height: auto;
				margin-bottom: 30px;
			}

			.logo-mundial {
				width: 620px;
				height: auto;
				margin-top: 0px;
			}

			/* ── ¡QUE PIQUE! tagline ── */
			.que-pique {
				display: inline-block;
				margin-top: 24px;
				background: rgb(244,202,53);
				border-radius: 6px;
				padding: 8px 26px 14px;
			}

			.que-pique span {
				font-family: "Radius", "Groches", sans-serif;
				color: #1d1c1a;
				font-size: 96px;
				line-height: 1;
				letter-spacing: 0.02em;
				text-transform: uppercase;
			}

			.que-pique span + span {
				margin-left: 18px;
			}

			/* ── Match section ── */
			.match-section {
				width: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				margin-top: 56px;
			}

			/* Three stars: small | large | small */
			.stars-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				width: 900px;
				margin-bottom: 20px;
			}

			.star-sm { width: 42px; height: auto; }
			.star-lg { width: 68px; height: auto; }

			/* Date */
			.match-date {
				font-family: "Groches", sans-serif;
				color: rgb(244,202,53);
				font-size: 66px;
				/* letter-spacing: 0.1em; */
				margin-bottom: -7px;
				margin-left: 17px;
				margin-bottom: 2px;
			}

			/* 3-column grid: left team | center | right team */
			.match-grid {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				width: 100%;
			}

			.team {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 18px;
			}

			/* ── Flag border beam ── */
			.flag-wrap {
				position: relative;
				border-radius: 8px;
				padding: 4px;
				overflow: hidden;
				perspective: 600px;
			}

			.flag-wrap::before {
				content: '';
				position: absolute;
				inset: -150%;
				background: conic-gradient(
					from 0deg,
					transparent 0deg,
					transparent 316deg,
					rgba(255, 212, 71, 0.4) 339deg,
					rgb(244,202,53) 354deg,
					#fff8d6 358deg,
					rgb(244,202,53) 363deg,
					rgba(255, 212, 71, 0.4) 382deg,
					transparent 406deg
				);
				animation: flag-beam-spin 2.4s linear infinite;
			}

			@keyframes flag-beam-spin {
				from { transform: rotate(0deg); }
				to   { transform: rotate(360deg); }
			}

			@keyframes flag-beam-spin-left {
				from { transform: scaleX(-1) rotate(0deg); }
				to   { transform: scaleX(-1) rotate(360deg); }
			}

			.team:first-child .flag-wrap::before {
				animation-name: flag-beam-spin-left;
			}

			.team-flag {
				position: relative;
				z-index: 1;
				display: block;
				width: 300px;
				border-radius: 5px;
				animation: flag-sway 3.5s ease-in-out 2s infinite;
			}

			.team:last-child .team-flag {
				animation-name: flag-sway-mirror;
			}

			@keyframes flag-sway {
				0%   { transform: rotateY(-7deg); }
				50%  { transform: rotateY(7deg); }
				100% { transform: rotateY(-7deg); }
			}

			@keyframes flag-sway-mirror {
				0%   { transform: rotateY(7deg); }
				50%  { transform: rotateY(-7deg); }
				100% { transform: rotateY(7deg); }
			}

			.team-name {
				font-family: "Groches", sans-serif;
				color: rgb(244,202,53);
				font-size: 61px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				text-align: center;
				margin-top: -12px;
			}

			.center-block {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 33px;
			}

			.match-time {
				font-family: "Groches", sans-serif;
				color: #1d1c1a;
				font-size: 130px;
				border: 5px solid rgb(244,202,53);
				line-height: 1;
				letter-spacing: 0.02em;
				border-radius: 20px;
				background: rgb(244,202,53);
				padding: 0px 15px 0px 30px;
			}

			.match-group {
				font-family: "Groches", sans-serif;
				color: rgb(244,202,53);
				font-size: 53px;
				border: 4px solid rgb(244,202,53);
				padding: 0 10px 0 20px;
				letter-spacing: 0.08em;
				border-radius: 10px;
			}

			/* ── Entrance animations ── */

			/* Spring easing: overshoots ~8% then settles */
			@keyframes bounce-in-scale {
				from { opacity: 0; transform: scale(0.5); }
				to   { opacity: 1; transform: scale(1); }
			}
			@keyframes bounce-in-top {
				from { opacity: 0; transform: translateX(-50%) translateY(-50px); }
				to   { opacity: 1; transform: translateX(-50%) translateY(0); }
			}
			@keyframes bounce-in-bottom {
				from { opacity: 0; transform: translateX(-50%) translateY(50px); }
				to   { opacity: 1; transform: translateX(-50%) translateY(0); }
			}
			@keyframes bounce-in-up {
				from { opacity: 0; transform: translateY(50px); }
				to   { opacity: 1; transform: translateY(0); }
			}
			@keyframes bounce-in-left {
				from { opacity: 0; transform: translateX(-80px); }
				to   { opacity: 1; transform: translateX(0); }
			}
			@keyframes bounce-in-right {
				from { opacity: 0; transform: translateX(80px); }
				to   { opacity: 1; transform: translateX(0); }
			}
			@keyframes fade-in {
				from { opacity: 0; }
				to   { opacity: 1; }
			}
			@keyframes star-spin-pos {
				from { transform: translateX(-50%) rotate(0deg); }
				to   { transform: translateX(-50%) rotate(360deg); }
			}
			@keyframes star-spin {
				from { transform: rotate(0deg); }
				to   { transform: rotate(360deg); }
			}

			.corner-frame {
				animation: fade-in .4s ease both;
			}
			.star-top {
				animation: bounce-in-top .7s cubic-bezier(.34,1.56,.64,1) .1s both,
				           star-spin-pos 3.1s linear .8s infinite;
			}
			.star-bottom {
				animation: bounce-in-bottom .7s cubic-bezier(.34,1.56,.64,1) .1s both,
				           star-spin-pos 4.7s linear .8s infinite;
			}
			.logo-victoria {
				animation: bounce-in-scale .7s cubic-bezier(.34,1.56,.64,1) .3s both;
			}
			.star-between {
				animation: bounce-in-scale .55s cubic-bezier(.34,1.56,.64,1) .55s both,
				           star-spin 2.6s linear 1.1s infinite;
			}
			.stars-row .star-sm:first-child {
				animation: star-spin 3.9s linear 1.6s infinite;
			}
			.stars-row .star-lg {
				animation: star-spin 2.3s linear 1.6s infinite;
			}
			.stars-row .star-sm:last-child {
				animation: star-spin 5.2s linear 1.6s infinite;
			}
			.logo-mundial {
				animation: bounce-in-scale .7s cubic-bezier(.34,1.56,.64,1) .7s both;
			}
			.que-pique {
				animation: bounce-in-scale .6s cubic-bezier(.34,1.56,.64,1) .85s both;
			}
			.stars-row {
				animation: bounce-in-up .6s cubic-bezier(.34,1.56,.64,1) 1s both;
			}
			.match-date {
				animation: bounce-in-up .55s cubic-bezier(.34,1.56,.64,1) 1.15s both;
			}
			.team:first-child .flag-wrap {
				animation: bounce-in-left .7s cubic-bezier(.34,1.56,.64,1) 1.3s both;
			}
			.team:last-child .flag-wrap {
				animation: bounce-in-right .7s cubic-bezier(.34,1.56,.64,1) 1.3s both;
			}
			.team-name {
				animation: bounce-in-up .55s cubic-bezier(.34,1.56,.64,1) 1.45s both;
			}
			.match-time {
				animation: bounce-in-scale .7s cubic-bezier(.34,1.56,.64,1) 1.3s both;
			}
			.match-group {
				animation: bounce-in-scale .6s cubic-bezier(.34,1.56,.64,1) 1.5s both;
			}
		</style>
	</head>
	<body>
		<div class="card-wrapper">
			<div class="card">
				<div class="overlay"></div>
				<img class="corner-frame" src="../assets/instagram/corner-verde.svg" alt="" aria-hidden="true" />

				<div class="content">
					<!-- Edge stars -->
					<img class="star-top"    src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
					<img class="star-bottom" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />

					<!-- La Victoria logo (includes "PERUVIAN STREET FOOD") -->
					<img
						class="logo-victoria"
						src="../assets/instagram/la-victoria.svg"
						alt="La Victoria Berlin"
					/>

					<!-- Single star between La Victoria and MUNDIAL -->
					<img
						class="star-between"
						src="../assets/instagram/estrella-verde.svg"
						alt=""
						aria-hidden="true"
					/>

					<!-- MUNDIAL 2026 logo -->
					<img
						class="logo-mundial"
						src="../assets/instagram/logo-mundial.svg"
						alt="Mundial 2026"
					/>

					<!-- ¡QUE PIQUE! tagline -->
					<div class="que-pique" aria-label="¡Que pique!">
						<span>¡QUE</span>
						<span>PIQUE!</span>
					</div>

					<!-- Match section -->
					<div class="match-section">
						<!-- Three stars: small | large | small -->
						<div class="stars-row">
							<img class="star-sm" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
							<img class="star-lg" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
							<img class="star-sm" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
						</div>

						<!-- Date -->
						<div class="match-date" id="match-date"></div>

						<!-- Flags + time + group + names -->
						<div class="match-grid">
							<div class="team">
								<div class="flag-wrap">
									<img class="team-flag" id="flag-left" src="" alt="" />
								</div>
								<span class="team-name" id="team-left-name"></span>
							</div>

							<div class="center-block">
								<div class="match-time" id="match-time"></div>
								<div class="match-group" id="match-group"></div>
							</div>

							<div class="team">
								<div class="flag-wrap">
									<img class="team-flag" id="flag-right" src="" alt="" />
								</div>
								<span class="team-name" id="team-right-name"></span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script>
			// ── EDITABLE MATCH DATA ──────────────────────────────────────
			const MATCH = {
				date:      '29.06.26',
				time:      '22:30',
				teamLeft:  { name: 'GERMANY',     flag: '../assets/instagram/germany.jpg' },
				teamRight: { name: 'PARAGUAY', flag: '../assets/instagram/paraguay.jpg' },
				group:     'ROUND OF 32',
			};
			// ────────────────────────────────────────────────────────────

			document.getElementById('match-date').textContent      = MATCH.date;
			document.getElementById('match-time').textContent      = MATCH.time;
			document.getElementById('match-group').textContent     = MATCH.group;
			document.getElementById('team-left-name').textContent  = MATCH.teamLeft.name;
			document.getElementById('team-right-name').textContent = MATCH.teamRight.name;
			document.getElementById('flag-left').src               = MATCH.teamLeft.flag;
			document.getElementById('flag-left').alt               = MATCH.teamLeft.name;
			document.getElementById('flag-right').src              = MATCH.teamRight.flag;
			document.getElementById('flag-right').alt              = MATCH.teamRight.name;

			// Scale 1080×1920 card to fit the viewport
			function scaleCard() {
				const card    = document.querySelector('.card');
				const wrapper = document.querySelector('.card-wrapper');
				const gap     = 32;
				const scale   = Math.min(
					(window.innerWidth  - gap) / 1080,
					(window.innerHeight - gap) / 1920
				);
				card.style.transform = `scale(${scale})`;
				wrapper.style.width  = `${1080 * scale}px`;
				wrapper.style.height = `${1920 * scale}px`;
			}
			scaleCard();
			window.addEventListener('resize', scaleCard);
		</script>
	</body>
</html>
