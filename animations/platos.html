<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Platos — La Victoria Berlin</title>
		<style>
			@font-face {
				font-family: "Radius";
				src: url("../assets/fonts/Radius-BoldNarrow.otf") format("opentype");
				font-display: swap;
			}
			@font-face {
				font-family: "Groches";
				src: url("../assets/fonts/GROCHES.otf") format("opentype");
				font-display: swap;
			}

			* { box-sizing: border-box; margin: 0; padding: 0; }

			:root { --yellow: rgb(255, 204, 0); --black: #1E1C1A; }

			body {
				background: #0a0a0a;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				overflow: hidden;
			}

			.card-wrapper { flex-shrink: 0; }

			.card {
				position: relative;
				width: 1080px;
				height: 1920px;
				background: var(--yellow);
				transform-origin: top left;
				overflow: hidden;
			}

			.corner-frame {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				z-index: 5;
				animation: frame-breath 4s ease-in-out infinite;
				transform-origin: center;
			}

			@keyframes frame-breath {
				0%,100% { transform: scale(1); }
				50%     { transform: scale(1.012); }
			}

			.side-star {
				position: absolute;
				height: auto;
				z-index: 4;
				pointer-events: none;
			}
			.side-star.logo-l { top: 260px;  left: 90px;  width: 72px; }
			.side-star.logo-r { top: 260px;  right: 90px; width: 72px; }
			.side-star.foot-l { bottom: 105px; left: 130px;  width: 54px; }
			.side-star.foot-r { bottom: 105px; right: 130px; width: 54px; }

			@keyframes star-spin  { to { transform: rotate(360deg); } }
			@keyframes star-spin-r { to { transform: rotate(-360deg); } }

			.side-star.logo-l { animation: star-spin   3.6s linear infinite; }
			.side-star.logo-r { animation: star-spin-r 3.6s linear infinite; }
			.side-star.foot-l { animation: star-spin-r 4.4s linear infinite; }
			.side-star.foot-r { animation: star-spin   4.4s linear infinite; }

			.logo-victoria {
				position: absolute;
				top: 150px;
				left: 50%;
				transform: translateX(-50%);
				width: 620px;
				height: auto;
				filter: brightness(0);
				z-index: 3;
			}

			/* ── Slide stage ── */
			.stage {
				position: absolute;
				top: 480px;
				left: 60px;
				right: 60px;
				bottom: 260px;
			}

			.slide {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				opacity: 0;
				animation: slide-cycle 18s infinite;
			}

			.dish-photo {
				width: 960px;
				height: 620px;
				object-fit: contain;
				filter: drop-shadow(0 24px 40px rgba(0,0,0,.28));
			}

			.dish-name {
				font-family: "Radius", "Groches", sans-serif;
				color: var(--black);
				font-size: 140px;
				line-height: 1;
				text-transform: uppercase;
				letter-spacing: 0.02em;
				text-align: center;
				margin-top: 10px;
				padding: 0 20px;
			}

			.dish-name.small { font-size: 108px; }

			.dish-price {
				font-family: "Groches", sans-serif;
				color: var(--black);
				font-size: 96px;
				line-height: 1;
				letter-spacing: 0.02em;
				margin-top: 22px;
				padding: 6px 34px 12px;
				background: #fff;
				border: 5px solid var(--black);
				border-radius: 18px;
				transform: rotate(-3deg);
			}

			.dish-price small {
				font-family: "Groches", sans-serif;
				font-size: 44px;
				margin-right: 6px;
				letter-spacing: 0.06em;
			}

			/* Each slide gets a 3s window inside an 18s (6 dishes × 3s) loop. */
			.slide:nth-child(1) { animation-delay: 0s; }
			.slide:nth-child(2) { animation-delay: 3s; }
			.slide:nth-child(3) { animation-delay: 6s; }
			.slide:nth-child(4) { animation-delay: 9s; }
			.slide:nth-child(5) { animation-delay: 12s; }
			.slide:nth-child(6) { animation-delay: 15s; }

			@keyframes slide-cycle {
				0%   { opacity: 0; transform: translateY(40px) scale(0.96); }
				2%   { opacity: 1; transform: translateY(0)    scale(1); }
				14%  { opacity: 1; transform: translateY(0)    scale(1); }
				17%  { opacity: 0; transform: translateY(-30px) scale(0.98); }
				100% { opacity: 0; }
			}

			/* ── Footer strip ── */
			.footer {
				position: absolute;
				bottom: 90px;
				left: 0;
				right: 0;
				text-align: center;
				z-index: 3;
			}

			.footer-text {
				font-family: "Groches", sans-serif;
				color: var(--black);
				font-size: 56px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.footer-sub {
				font-family: "Groches", sans-serif;
				color: var(--black);
				font-size: 34px;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				margin-top: 10px;
				opacity: .8;
			}
		</style>
	</head>
	<body>
		<div class="card-wrapper">
			<div class="card">
				<img class="corner-frame" src="../assets/instagram/corner.svg" alt="" aria-hidden="true"
				     onerror="this.style.display='none'" />

				<img class="side-star logo-l" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
				<img class="side-star logo-r" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
				<img class="side-star foot-l" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />
				<img class="side-star foot-r" src="../assets/instagram/estrella-verde.svg" alt="" aria-hidden="true" />

				<img class="logo-victoria" src="../assets/instagram/la-victoria.svg" alt="La Victoria Berlin" />

				<div class="stage">
					<div class="slide">
						<img class="dish-photo" src="../assets/images/anticucho-beef-heart-roasted-potatoes-choclos-corn-la-victoria-berlin.webp" alt="Anticuchos" />
						<div class="dish-name">Anticuchos</div>
						<div class="dish-price"><small>desde</small>10 €</div>
					</div>
					<div class="slide">
						<img class="dish-photo" src="../assets/images/fresh-ceviche-fish-carrot-rocoto-onion-la-victoria-berlin.webp" alt="Ceviche" />
						<div class="dish-name">Ceviche</div>
						<div class="dish-price">14 €</div>
					</div>
					<div class="slide">
						<img class="dish-photo" src="../assets/images/pan-con-chicharron-sanguche-sandwich-la-victoria-belrin.webp" alt="Pan con Chicharrón" />
						<div class="dish-name small">Pan con Chicharrón</div>
						<div class="dish-price">10 €</div>
					</div>
					<div class="slide">
						<img class="dish-photo" src="../assets/images/papa-rellena-meat-olives-deep-frieid-la-victoria-berlin.webp" alt="Papa Rellena" />
						<div class="dish-name">Papa Rellena</div>
						<div class="dish-price"><small>desde</small>7,50 €</div>
					</div>
					<div class="slide">
						<img class="dish-photo" src="../assets/images/pollo-a-la-brasa-sanguche-hamburguesa-la-victoria-berlin.webp" alt="Pollo a la Brasa" />
						<div class="dish-name small">Pollo a la Brasa</div>
						<div class="dish-price">10 €</div>
					</div>
					<div class="slide">
						<img class="dish-photo" src="../assets/images/salchipapa-la-victoria-berlin.webp" alt="Salchipapa" />
						<div class="dish-name">Salchipapa</div>
						<div class="dish-price">?? €</div>
					</div>
				</div>

				<div class="footer">
					<div class="footer-text">Peruvian Street Food · Berlin</div>
					<div class="footer-sub">Markthalle Pfefferberg</div>
				</div>
			</div>
		</div>

		<script>
			// Scale 1080×1920 card to fit the viewport
			function scaleCard() {
				const card    = document.querySelector('.card');
				const wrapper = document.querySelector('.card-wrapper');
				const gap     = 32;
				const scale   = Math.min(
					(window.innerWidth  - gap) / 1080,
					(window.innerHeight - gap) / 1920
				);
				card.style.transform = `scale(${scale})`;
				wrapper.style.width  = `${1080 * scale}px`;
				wrapper.style.height = `${1920 * scale}px`;
			}
			scaleCard();
			window.addEventListener('resize', scaleCard);
		</script>
	</body>
</html>
