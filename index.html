  <!-- Spracherkennung: zuvor gewählte Sprache > Browsersprache > Fallback (de) -->
  <script>
    (function () {
      var supported = ['de', 'en', 'es', 'fr', 'it'];
      var fallback = 'de';
      var pick = null;

      // 1) Vom Nutzer zuvor gewählte Sprache
      try {
        var stored = localStorage.getItem('lv_lang');
        if (stored && supported.indexOf(stored) !== -1) pick = stored;
      } catch (e) {}

      // 2) Browsersprache(n)
      if (!pick) {
        var langs = navigator.languages || [navigator.language || navigator.userLanguage || ''];
        for (var i = 0; i < langs.length; i++) {
          var code = (langs[i] || '').slice(0, 2).toLowerCase();
          if (supported.indexOf(code) !== -1) { pick = code; break; }
        }
      }

      location.replace((pick || fallback) + '/');
    })();
  </script>
